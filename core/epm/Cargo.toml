[package]
name = "epm"
version = "0.3.0"
edition = "2021"
description = "Elysium Package Manager - npm-like package management for Elysium"

[[bin]]
name = "epm"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1"
tar = "0.4"
tempfile = "3"
semver = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
