name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  ##############################################################################
  # Build native binaries for each supported platform
  ##############################################################################
  build-binaries:
    name: Build binary (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            llvm_install: |
              sudo apt-get update && sudo apt-get install -y llvm-18-dev libclang-18-dev libpolly-18-dev
          - os: macos-latest
            target: aarch64-apple-darwin
            llvm_install: brew install llvm@18
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM 18
        run: ${{ matrix.llvm_install }}
        shell: bash

      - uses: dtolnay/rust-toolchain@stable

      - name: Add cross-compilation target
        run: rustup target add ${{ matrix.target }}

      - name: Build binary
        continue-on-error: true
        working-directory: npm-package
        run: node scripts/build-binaries.js

      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: binary-${{ matrix.target }}
          path: npm-package/dist/*.gz

  ##############################################################################
  # Create a GitHub Release and attach all binary tarballs
  ##############################################################################
  create-release:
    name: Create GitHub Release
    needs: build-binaries
    if: always()
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: binary-*
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: '*.gz'
          generate_release_notes: true

  ##############################################################################
  # Publish the npm package via Trusted Publishing (OIDC).
  ##############################################################################
  publish-npm:
    name: Publish to npm
    needs: create-release
    if: always()
    permissions:
      id-token: write
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Publish package
        working-directory: npm-package
        run: npm publish