name: Mirror Docs

# Pushes core/docs to elysiumlang/elysiumlang.github.io (docs-only Pages repo).
# Requires secret DOCS_DEPLOY_TOKEN with push access to that repository.

on:
  push:
    branches: [main]
    paths:
      - 'core/docs/**'
      - '.github/workflows/docs-mirror.yml'
  workflow_dispatch:

jobs:
  mirror:
    name: Mirror to elysiumlang.github.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Push core/docs to Pages repo
        env:
          DOCS_DEPLOY_TOKEN: ${{ secrets.DOCS_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          cp -a core/docs/. "$workdir/"
          cd "$workdir"
          git init -b main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: mirror from ${{ github.repository }}@${{ github.sha }}"
          git push --force "https://x-access-token:${DOCS_DEPLOY_TOKEN}@github.com/elysiumlang/elysiumlang.github.io.git" main
